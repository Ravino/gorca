[package]
name = "gorca-ext-api"
description = "Extension WIT world, Rust trait mirror and (later) generated bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The pure text layer (no tokio, no I/O): the terminal presents caret moves with the same code as
# every other editor (docs/reports/unified-editing.md).
gorca-text = { workspace = true }
gorca-i18n = { workspace = true }

# The component build of an extension (wasm32 only). Native builds and the host never link it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "=0.46.0" }

[dev-dependencies]
wit-parser = { workspace = true }

[lints]
workspace = true
