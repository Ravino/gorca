[package]
name = "gorca-ext-api"
description = "Extension WIT world, Rust trait mirror and (later) generated bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

[dependencies]
gorca-i18n = { workspace = true }

# The component build of an extension (wasm32 only). Native builds and the host never link it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "=0.46.0" }

[dev-dependencies]
wit-parser = { workspace = true }
# Test-only: the equality test compares the generated copy with the model registries.
gorca-model = { workspace = true }

[lints]
workspace = true
