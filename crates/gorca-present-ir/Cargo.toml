[package]
name = "gorca-present-ir"
description = "The PresIr records (ADR-0022 section 2.5): pure data, no runtime, shared with the plugin API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gorca-model = { workspace = true }
gorca-i18n = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }

[features]
# Host-only allocators (ExtKinds, LangTags). Only host crates enable it; the plugin API does not.
host = []

[dev-dependencies]
gorca-present-ir = { path = ".", features = ["host"] }

[lints]
workspace = true
