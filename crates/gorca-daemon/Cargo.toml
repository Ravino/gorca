[package]
name = "gorca-daemon"
description = "The `gorca` binary: config, wiring, signals. The only crate that wires concrete implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gorca"
path = "src/main.rs"

[dependencies]
gorca-core = { workspace = true }
ext-gnome-shell = { path = "../../extensions/ext-gnome-shell" }
ext-vte = { workspace = true }
gorca-ext-api = { workspace = true }
gorca-mirror = { workspace = true }
gorca-rt = { workspace = true }
gorca-dbus = { workspace = true }
gorca-config = { workspace = true }
gorca-model = { workspace = true }
gorca-i18n = { workspace = true }
gorca-connector-api = { workspace = true }
gorca-connector-atspi = { workspace = true }
gorca-doc-source-atspi = { workspace = true }
gorca-output-api = { workspace = true }
gorca-shell-helper = { workspace = true }
gorca-input-api = { workspace = true }
gorca-input-mutter = { workspace = true }
gorca-input-xkb = { workspace = true }
gorca-speech = { workspace = true }
gorca-speech-voicego = { workspace = true }
gorca-speech-ssip = { workspace = true }
gorca-ext-host = { workspace = true }
thiserror = { workspace = true }
zbus = { workspace = true }
serde = { workspace = true }
rayon = { workspace = true }
smallvec = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["process"] }
inotify = { workspace = true }
futures-lite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
gorca-testkit = { workspace = true }
serde_json = "1"
tokio = { workspace = true, features = ["test-util"] }
