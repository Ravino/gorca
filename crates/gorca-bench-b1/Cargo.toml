[package]
name = "gorca-bench-b1"
description = "Bake-off B-1 (mirror fill strategy) harness: verdict classifier, message accounting, interleaved runner, step bench."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Reuses the B-2 harness wire codec (`BusConn`), exact percentiles and report rows.
gorca-bench-b2 = { workspace = true }
# The keyed tag of a secret field (the daemon never logs password text).
gorca-model = { workspace = true }
anyhow = { workspace = true }
serde_json = "1"

[dev-dependencies]
# The step bench (H-7) links the tree's `gorca_mirror::fill::Candidate` through its adapter.
gorca-mirror = { workspace = true }
gorca-ingress = { workspace = true }

[[bin]]
name = "b1"
path = "src/bin/b1.rs"

[[bench]]
name = "step"
harness = false

[lints]
workspace = true
