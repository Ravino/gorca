# Built-in keymap preset `orca-desktop` (ADR-0005 7.2, docs/design/modes.md).
# Same format as the user's gorca.toml; edit your own file, not this one.

[keymap.global]
"kp_enter" = "info.where_am_i"
"gorca+kp_enter" = "info.window_title"
"gorca+kp_enter*2" = "info.status_bar"
"gorca+t" = "info.time_date"
"gorca+shift+up" = "info.selection"
"gorca+f" = "info.formatting"
"gorca+h" = "input.learn_mode_toggle"
"gorca+1" = "input.learn_mode_toggle"
"gorca+s" = "speech.mode_cycle"
"gorca+v" = "verbosity.cycle"
"gorca+x" = "speech.repeat_last"
"gorca+f2" = "input.pass_next_key"
"gorca+2" = "echo.typed_chars_toggle"
"gorca+3" = "echo.typed_words_toggle"
"gorca+4" = "echo.command_keys_toggle"
"gorca+7" = "review.focus_follows_toggle"
"gorca+ctrl+r" = "settings.reload"
"gorca+ctrl+c" = "settings.save"
"gorca+ctrl+shift+r" = "settings.report_problems"
"gorca+f1" = "debug.node_info"
"gorca+ctrl+f1" = "debug.app_info"
"ctrl+alt+shift+q" = "input.sleep_toggle"
"kp_add" = "text.say_all"
"kp_subtract" = "review.toggle"
"kp_home" = "review.prev_line"
"kp_up" = "review.cur_line"
"kp_prior" = "review.next_line"
"kp_left" = "review.prev_word"
"kp_begin" = "review.cur_word"
"kp_right" = "review.next_word"
"kp_end" = "review.prev_char"
"kp_down" = "review.cur_char"
"kp_next" = "review.next_char"
"gorca+kp_home" = "review.top"
"gorca+kp_prior" = "review.bottom"
"gorca+kp_end" = "review.end_of_line"
"kp_add*2" = "review.say_all"
"gorca+kp_begin" = "object.current"
"gorca+ctrl+up" = "object.parent"
"gorca+ctrl+down" = "object.first_child"
"gorca+ctrl+right" = "object.next"
"gorca+ctrl+left" = "object.prev"
"gorca+ctrl+return" = "review.activate"
"gorca+a" = "browse.toggle"
"gorca+z" = "browse.single_letter_toggle"
"gorca+backslash" = "browse.live_regions_toggle"

[keymap.browse]
"q" = "quicknav.next.blockquote"
"shift+q" = "quicknav.prev.blockquote"
"b" = "quicknav.next.button"
"shift+b" = "quicknav.prev.button"
"x" = "quicknav.next.checkbox"
"shift+x" = "quicknav.prev.checkbox"
"c" = "quicknav.next.combobox"
"shift+c" = "quicknav.prev.combobox"
"e" = "quicknav.next.edit"
"shift+e" = "quicknav.prev.edit"
"f" = "quicknav.next.form_field"
"shift+f" = "quicknav.prev.form_field"
"h" = "quicknav.next.heading"
"shift+h" = "quicknav.prev.heading"
"g" = "quicknav.next.graphic"
"shift+g" = "quicknav.prev.graphic"
"m" = "quicknav.next.landmark"
"shift+m" = "quicknav.prev.landmark"
"l" = "quicknav.next.list"
"shift+l" = "quicknav.prev.list"
"i" = "quicknav.next.list_item"
"shift+i" = "quicknav.prev.list_item"
"p" = "quicknav.next.paragraph"
"shift+p" = "quicknav.prev.paragraph"
"r" = "quicknav.next.radio"
"shift+r" = "quicknav.prev.radio"
"t" = "quicknav.next.table"
"shift+t" = "quicknav.prev.table"
"k" = "quicknav.next.link"
"shift+k" = "quicknav.prev.link"
"u" = "quicknav.next.unvisited"
"shift+u" = "quicknav.prev.unvisited"
"v" = "quicknav.next.visited"
"shift+v" = "quicknav.prev.visited"
"o" = "quicknav.next.embedded"
"shift+o" = "quicknav.prev.embedded"
"a" = "quicknav.next.clickable"
"shift+a" = "quicknav.prev.clickable"
"s" = "quicknav.next.separator"
"shift+s" = "quicknav.prev.separator"
"d" = "quicknav.next.live_region"
"shift+d" = "quicknav.prev.live_region"
"y" = "quicknav.next.last_live_region"
"shift+y" = "quicknav.prev.last_live_region"
"1" = "quicknav.next.heading1"
"shift+1" = "quicknav.prev.heading1"
"2" = "quicknav.next.heading2"
"shift+2" = "quicknav.prev.heading2"
"3" = "quicknav.next.heading3"
"shift+3" = "quicknav.prev.heading3"
"4" = "quicknav.next.heading4"
"shift+4" = "quicknav.prev.heading4"
"5" = "quicknav.next.heading5"
"shift+5" = "quicknav.prev.heading5"
"6" = "quicknav.next.heading6"
"shift+6" = "quicknav.prev.heading6"
"comma" = "browse.container_end"
"shift+comma" = "browse.container_start"
"down" = "browse.cursor_next_line"
"up" = "browse.cursor_prev_line"
"right" = "browse.cursor_next_char"
"left" = "browse.cursor_prev_char"
"ctrl+right" = "browse.cursor_next_word"
"ctrl+left" = "browse.cursor_prev_word"
"home" = "browse.cursor_line_start"
"end" = "browse.cursor_line_end"
"ctrl+home" = "browse.cursor_top"
"ctrl+end" = "browse.cursor_bottom"
"prior" = "browse.cursor_page_up"
"next" = "browse.cursor_page_down"
"escape" = "browse.escape"
"return" = "browse.activate"
"kp_enter" = "browse.activate"
"space" = "browse.activate"
