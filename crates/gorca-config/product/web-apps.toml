# Product rows for web-capable applications (ADR-0016 section 2.7, owner decision DP-3).
# Compiled into gorca-config. These rows apply in safe mode and under `profiles.suspend`
# (the CHR-0 interim table did), so a code editor never gets a virtual buffer by accident.
schema = 1

[[profile]]
id = "vscode"
name = "Visual Studio Code"
why = "an editor built from text widgets and its own key bindings; NVDA disables the buffer for it (appModules/code.py)"
triggers = [{ app = { name = ["code", "visual studio code", "code - oss", "vscodium", "cursor"] } }]

[profile.values]
browse.enabled = false

# Proposed telegram-web rows (docs/reports/telegram-web-a-study.md, section 2b). NOT active: they need the
# plugin watch/skip schema of ADR-0026, which the profile schema does not have yet.
#   site web.telegram.org /a/* and /k/*  (one plugin for both, owner QP-1)
#   announce additions under .messages-container (A) / .bubbles-inner (K), coalesce floods
#   skip avatar text (.Avatar, .dialog-avatar), say "N unread" for .ChatBadge / .dialog-subtitle-badge
#   treat .Message (A) as a navigable message item
