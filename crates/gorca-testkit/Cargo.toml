[package]
name = "gorca-testkit"
description = "Fake connector, fake DocSource, virtual clock, conformance suites, storm generator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gorca-model = { workspace = true }
gorca-rt = { workspace = true }
gorca-ingress = { workspace = true }
gorca-connector-api = { workspace = true }
gorca-doc-source-api = { workspace = true }
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }
smallvec = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = "1"
libc = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "b1-walk"
path = "src/bin/b1_walk.rs"

[dev-dependencies]
# Contract test: the run directories of the walk driver are evaluated by the real runner code.
gorca-bench-b1 = { path = "../gorca-bench-b1" }
