epoch = "m22b1"
reason = "SM-5: availability does not apply to static structure (documents, panels, lists, rows, cells, separators, labels); the model never says it is unavailable. The legacy presenter said it for any node whose sensitive state flipped."
until = "2026-11-07"

[[deviation]]
