[package]
name = "gorca-core"
description = "Reader, app actors, doc actors, Focus/Mode state machines, presenter, PresentJob."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gorca-model = { workspace = true }
gorca-i18n = { workspace = true }
gorca-rt = { workspace = true }
gorca-ingress = { workspace = true }
gorca-mirror = { workspace = true }
gorca-fuse = { workspace = true }
gorca-connector-api = { workspace = true }
gorca-doc-source-api = { workspace = true }
gorca-doc = { workspace = true }
gorca-text = { workspace = true }
gorca-ext-api = { workspace = true }
scc = { workspace = true }
gorca-output-api = { workspace = true }
gorca-input-api = { workspace = true }
gorca-speech = { workspace = true }
gorca-config = { workspace = true }
chrono = { workspace = true }
smallvec = { workspace = true }
unicode-segmentation = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
# Run the legacy-agreement check (ADR-0022 2.11) in release builds too: the CI e2e build.
legacy-agree = []
# Segments carry a message id and an origin id (ADR-0022 2.5): tests and the explain trace.
seg-origin = ["gorca-model/seg-origin"]

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
ext-vte = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
gorca-testkit = { workspace = true }
gorca-doc-source-atspi = { workspace = true }
