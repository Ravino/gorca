<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Change gallery</title></head>
<body>
<main>
<h1>Change gallery</h1>
<p><label><input type="checkbox" id="check"> Subscribe</label></p>
<p><label><input type="checkbox" id="mixed"> Partial</label></p>
<p><span role="switch" tabindex="0" aria-checked="false" id="toggle" aria-label="Wi-Fi">Wi-Fi</span></p>
<p><button id="press" aria-pressed="false">Bold</button></p>
<p><button id="expand" aria-expanded="false" aria-controls="more">Details</button><span id="more" hidden>inside</span></p>
<p><button id="disable">Save</button></p>
<ul role="listbox" aria-label="Choices" id="select">
<li role="option" aria-selected="true" id="o1" tabindex="0">One</li>
<li role="option" aria-selected="false" id="o2" tabindex="-1">Two</li>
<li role="option" aria-selected="false" id="o3" tabindex="-1">Three</li>
</ul>
<p><button id="rename">Old name</button></p>
<p>
<button id="do-check" onclick="document.getElementById('check').checked=true">do:check</button>
<button id="do-mixed" onclick="document.getElementById('mixed').indeterminate=true">do:mixed</button>
<button id="do-toggle" onclick="document.getElementById('toggle').setAttribute('aria-checked','true')">do:toggle</button>
<button id="do-press" onclick="document.getElementById('press').setAttribute('aria-pressed','true')">do:press</button>
<button id="do-expand" onclick="document.getElementById('expand').setAttribute('aria-expanded','true');document.getElementById('more').hidden=false">do:expand</button>
<button id="do-disable" onclick="document.getElementById('disable').disabled=true">do:disable</button>
<button id="do-select" onclick="document.getElementById('o1').setAttribute('aria-selected','false');document.getElementById('o2').setAttribute('aria-selected','true')">do:select</button>
<button id="do-rename" onclick="document.getElementById('rename').textContent='New name'">do:rename</button>
</p>
</main>
</body></html>
