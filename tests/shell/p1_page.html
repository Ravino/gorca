<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>P1 Page</title></head>
<body>
<main>
<h1>P1 Page</h1>
<p>Intro text for the browse cursor.</p>
<nav aria-label="Primary">
  <ul>
    <li><a href="#alpha">Alpha</a></li>
    <li><a href="#beta">Beta</a></li>
  </ul>
</nav>
<table>
  <caption>Fruit</caption>
  <tr><th>Name</th><th>Count</th></tr>
  <tr><td>Apple</td><td>3</td></tr>
</table>
<h2>Summary</h2>
<p>
  <label><input type="checkbox" id="sub"> Subscribe</label>
</p>
<p>
  <button id="det" aria-expanded="false" aria-controls="more"
          onclick="var e=this.getAttribute('aria-expanded')==='true';this.setAttribute('aria-expanded',e?'false':'true');document.getElementById('more').hidden=e;">Details</button>
</p>
<div id="more" hidden>More text</div>
<p>
  <label for="vol">Volume</label>
  <input type="range" id="vol" min="0" max="100" step="10" value="50">
</p>
<!-- a control 30 groups deep: the ancestry is longer than any fixed walk limit -->
<div role="group" aria-label="Level 0"><div role="group" aria-label="Level 1"><div role="group" aria-label="Level 2"><div role="group" aria-label="Level 3"><div role="group" aria-label="Level 4"><div role="group" aria-label="Level 5"><div role="group" aria-label="Level 6"><div role="group" aria-label="Level 7"><div role="group" aria-label="Level 8"><div role="group" aria-label="Level 9"><div role="group" aria-label="Level 10"><div role="group" aria-label="Level 11"><div role="group" aria-label="Level 12"><div role="group" aria-label="Level 13"><div role="group" aria-label="Level 14"><div role="group" aria-label="Level 15"><div role="group" aria-label="Level 16"><div role="group" aria-label="Level 17"><div role="group" aria-label="Level 18"><div role="group" aria-label="Level 19"><div role="group" aria-label="Level 20"><div role="group" aria-label="Level 21"><div role="group" aria-label="Level 22"><div role="group" aria-label="Level 23"><div role="group" aria-label="Level 24"><div role="group" aria-label="Level 25"><div role="group" aria-label="Level 26"><div role="group" aria-label="Level 27"><div role="group" aria-label="Level 28"><div role="group" aria-label="Level 29"><button id="deepbtn">Deep</button></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div></div>
</main>
</body>
</html>
