[package]
name = "b1-fakeapp"
description = "B-1 bake-off fake AT-SPI application: many models, serial service-time model, quirk flags, truth log, control channel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "b1-fakeapp"
path = "src/main.rs"

[dependencies]
gorca-testkit = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "io-std", "fs", "process"] }
zbus = { workspace = true, features = ["p2p"] }
zvariant = "5"
serde = { workspace = true, features = ["derive", "std"] }
serde_json = "1"
anyhow = { workspace = true }
futures-lite = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true
