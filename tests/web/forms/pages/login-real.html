<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FL Real logins</title>
<style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tg{position:relative}.tg label{position:absolute;pointer-events:none}</style></head>
<body>
<!-- Shapes copied from the public markup of the real sites (reduced, no scripts). -->
<main>
<h1>Real-world login shapes</h1>

<!-- Google accounts (identifier step): aria-label on the input, the visible label is a floating span -->
<section aria-label="Google shape">
 <div><div><input type="email" id="identifierId" name="identifier" autocomplete="username" aria-label="Email or phone" aria-describedby="idSIdError" spellcheck="false"></div>
 <div id="idSIdError" class="sr-only"></div>
 <span>Email or phone</span></div>
 <div><input type="password" name="Passwd" aria-label="Enter your password" autocomplete="current-password"></div>
 <div><input type="checkbox" id="showpw" aria-label="Show password"><label for="showpw">Show password</label></div>
 <button type="button"><span>Next</span></button>
</section>

<!-- GitHub /login: label for + input -->
<section aria-label="GitHub shape">
 <div class="auth-form-header"><h2>Sign in to GitHub</h2></div>
 <label for="login_field">GHUser name or email address</label>
 <input type="text" name="login" id="login_field" class="form-control" autocapitalize="off" autocorrect="off" autocomplete="username">
 <label for="password">GHPass word</label>
 <input type="password" name="password" id="password" class="form-control" autocomplete="current-password">
 <input type="submit" name="commit" value="Sign in" class="btn btn-primary">
 <a href="#forgot">Forgot password?</a>
</section>

<!-- Telegram Web K sign-in: contenteditable div + sibling label, no association -->
<section aria-label="Telegram K shape">
 <div class="input-field tg input-field-phone">
  <div contenteditable="true" class="input-field-input" inputmode="decimal" autocomplete="off" data-name="phone" dir="auto"></div>
  <label>TGK Phone Number</label>
 </div>
 <button type="button" class="btn-primary"><span>NEXT</span></button>
</section>

<!-- Telegram Web A sign-in: input + label for + aria-label -->
<section aria-label="Telegram A shape">
 <div class="input-group"><input class="form-control" type="tel" id="sign-in-phone-number" autocomplete="off" aria-label="TGA Your phone number" value="+1">
 <label for="sign-in-phone-number">TGA Your phone number</label></div>
 <div class="input-group touched"><input class="form-control" type="password" id="sign-in-password" maxlength="256" autocomplete="off" inputmode="text" aria-label="TGA Password" value=""><label for="sign-in-password">TGA Password</label></div>
</section>

<!-- Material/React (MUI TextField): label for + id, outlined legend span, helper text -->
<section aria-label="React MUI shape">
 <div class="MuiFormControl-root"><label class="MuiInputLabel-root" for="mui-1" id="mui-1-label">MUI Email</label>
 <div class="MuiOutlinedInput-root"><input aria-invalid="false" id="mui-1" type="text" aria-describedby="mui-1-helper" class="MuiInputBase-input"><fieldset aria-hidden="true"><legend><span>MUI Email</span></legend></fieldset></div>
 <p id="mui-1-helper" class="MuiFormHelperText-root">We never share it</p></div>
</section>

<!-- Bootstrap floating label: label AFTER the input, placeholder only duplicates it -->
<section aria-label="Bootstrap floating shape">
 <div class="form-floating"><input type="email" class="form-control" id="floatingInput" placeholder="name@example.com"><label for="floatingInput">BS Email address</label></div>
 <div class="form-floating"><input type="password" class="form-control" id="floatingPassword" placeholder="Password"><label for="floatingPassword">BS Password</label></div>
</section>

<!-- Search box: type=search + placeholder only -->
<section><form role="search" aria-label="Site search" onsubmit="return false"><input type="search" placeholder="Search the wiki" name="q"><button type="submit">Go</button></form></section>
</main>
</body>
</html>
