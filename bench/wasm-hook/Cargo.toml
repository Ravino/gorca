# Standalone workspace: keeps wasmtime out of the gorca workspace lockfile (ADR-0001 §11 rule 1).
# Build and run: see README.md.
[workspace]
resolver = "3"
members = ["logic", "host", "guest"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "TBD"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false
