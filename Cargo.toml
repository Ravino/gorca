# gorca workspace. Layout and dependency rules: docs/adr/0001-core-architecture.md section 11.
# Dependency rules are enforced by `cargo xtask deps` (tools/check-deps.sh).
[workspace]
resolver = "3"
members = [
    "crates/*",
    "extensions/*",
    "tests/harness/b1/fakeapp",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
# Core: GPL-3.0-or-later (plus the section 7 permission in LICENSE-EXCEPTION).
# The extension SDK crate (gorca-ext-api) overrides this with MIT OR Apache-2.0.
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/Ravino/gorca"

[workspace.dependencies]
# Internal crates.
gorca-model = { path = "crates/gorca-model" }
gorca-i18n = { path = "crates/gorca-i18n" }
gorca-config = { path = "crates/gorca-config" }
gorca-rt = { path = "crates/gorca-rt" }
gorca-ingress = { path = "crates/gorca-ingress" }
gorca-mirror = { path = "crates/gorca-mirror" }
gorca-connector-api = { path = "crates/gorca-connector-api" }
gorca-doc-source-api = { path = "crates/gorca-doc-source-api" }
gorca-doc = { path = "crates/gorca-doc" }
gorca-text = { path = "crates/gorca-text" }
gorca-doc-source-atspi = { path = "crates/gorca-doc-source-atspi" }
gorca-bench-web = { path = "crates/gorca-bench-web" }
gorca-output-api = { path = "crates/gorca-output-api" }
gorca-speech = { path = "crates/gorca-speech" }
gorca-speech-ssip = { path = "crates/gorca-speech-ssip" }
gorca-speech-voicego = { path = "crates/gorca-speech-voicego" }
gorca-input-api = { path = "crates/gorca-input-api" }
gorca-input-mutter = { path = "crates/gorca-input-mutter" }
gorca-input-inject = { path = "crates/gorca-input-inject" }
gorca-input-xkb = { path = "crates/gorca-input-xkb" }
gorca-dbus = { path = "crates/gorca-dbus" }
gorca-connector-atspi = { path = "crates/gorca-connector-atspi" }
gorca-core = { path = "crates/gorca-core" }
gorca-braille-brlapi = { path = "crates/gorca-braille-brlapi" }
gorca-ext-api = { path = "crates/gorca-ext-api" }
gorca-ext-host = { path = "crates/gorca-ext-host" }
ext-vte = { path = "extensions/ext-vte" }
gorca-testkit = { path = "crates/gorca-testkit" }
gorca-bench-b2 = { path = "crates/gorca-bench-b2" }

# Async runtime and plumbing.
tokio = { version = "1.53", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal"] }
tokio-util = { version = "0.7", default-features = false }
futures-core = "0.3"
futures-lite = { version = "2", default-features = false, features = ["std"] }

# D-Bus and AT-SPI (allowed only in the crates named in ADR section 11, rule 2).
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
atspi = { version = "0.30", default-features = false, features = ["tokio"] }

# Errors and diagnostics.
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

# Data structures.
serde = { version = "1", default-features = false }
smallvec = "1"
unicode-segmentation = "1"
bitflags = "2"
arc-swap = "1"
scc = "3"
crossbeam-queue = "0.3"
libc = "0.2"

# Pinned for later phases, not yet used by any crate.
rayon = "1.12"
# Extension host (M5). 49.0.3 is what the ADR-0008 prototype measured; no WASI crate on purpose:
# extensions get no ambient capability, the host links only what the WIT world and a few pure
# WASI clock/random imports need.
wasmtime = { version = "=49.0.3", default-features = false }

# Local wall-clock time for info.time_date (pure Rust time zone handling, no libc calls).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Configuration files (ADR-0005): format-preserving parse and save, no serde.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

# inotify for the settings file watcher (daemon only).
inotify = { version = "0.11", default-features = false, features = ["stream"] }

# Tooling and tests.
cargo_metadata = "0.23"
criterion = { version = "0.8", default-features = false }
wit-parser = "0.261"

# Terminal policy: user-configurable prompt and password-prompt expressions (ext-vte).
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# ADR section 11, rule 6. Tests are exempted through clippy.toml (allow-*-in-tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise at this stage of the project.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
# `assert!(x.is_empty())` is clearer in tests than `assert_eq!(x, [] as [T; 0])`.
assert_is_empty = "allow"
# The docs quote the ADR heavily; identifiers like AT-SPI, SourceLayer or DocNodeId in prose
# would need backticks everywhere.
doc_markdown = "allow"

[profile.release]
# ADR section 11, rule 7: supervised restarts need unwinding panics.
panic = "unwind"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
panic = "unwind"
