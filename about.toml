# cargo-about configuration: generates the dependency licence notices at release time.
#   cargo about generate about.hbs > THIRD-PARTY-LICENSES.html
# Every licence accepted here is compatible with GPL-3.0-or-later.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "LGPL-2.1-or-later",
    "CC0-1.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
