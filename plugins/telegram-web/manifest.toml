# First-party plugin P-3 (ADR-0026 section 2.8): Telegram Web A and K.
# Everything Telegram-specific lives here; the core has no special case for it.

[plugin]
id = "gorca.telegram-web"
version = "0.1.0"
world = "site"
class = "interactive"

[permissions]
# Names of the chat rows' parts, their CSS classes, and the facts the plugin derives.
grants = ["read-names", "read-attributes", "contribute-facts"]

[match]
# The verified identity of the browser (executable name of a system install).
apps = ["firefox-esr", "firefox", "chromium", "chrome", "google-chrome"]
urls = ["https://web.telegram.org/a/*", "https://web.telegram.org/k/*"]

# A: a chat row is `div.ListItem-button[role=button]`.
[[watch]]
id = 1
class = "ListItem-button"

# K: a chat row is `a.chatlist-chat`.
[[watch]]
id = 2
tag = "a"
class = "chatlist-chat"

# A: a message is `div.Message`, with no role of its own: an item of the message list.
[[watch]]
id = 3
class = "Message"

# A: the message list of the open chat (a flat run of `div.Message` and `div.sticky-date`
# children): a list.
[[watch]]
id = 4
class = "MessageList"

# A: the chat view; the header title (an `h3.fullName` that is a direct child of it, outside every
# chat-list row; there is no `MiddleHeader`/`ChatInfo` in the accessible tree) becomes a
# first-level heading.
[[watch]]
id = 5
class = "messages-layout"

# A: the date separators of a chat: second-level headings.
[[watch]]
id = 6
class = "sticky-date"

# A: the "Unread messages" divider of a chat (class names unverified: no chat with unread
# messages has been dumped yet): a second-level heading as well.
[[watch]]
id = 7
class = "unread-divider"

[[watch]]
id = 8
class = "local-action-message"
